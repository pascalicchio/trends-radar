name: refresh-trends
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), at :17 to avoid the top-of-hour rush
  push:
    paths: ["snapshots/**", "config/**", "pipeline/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh-trends
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Build radar
        env: { TZ: America/New_York }
        run: python pipeline/build.py
      - name: Commit outputs
        run: |
          git config user.name "trends-radar-bot"
          git config user.email "trends-radar-bot@users.noreply.github.com"
          git add out history
          git diff --cached --quiet && exit 0
          git commit -m "radar: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push && exit 0; sleep 5; done
          exit 1
