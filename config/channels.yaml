# Channels the radar scores topics against. Add a channel by appending a block.
# Fit (informational only; ranking is by heat):
#   - fit is 0 unless at least one `strong` keyword matches the topic text (label, Wikipedia/Wikidata description, headlines)
#   - score = 45 per distinct strong hit (max 2) + 8 per weak hit (max 3), capped at 100
#   - entity gate: if Wikidata types the topic as athlete / sports_team / sports_event / actor / musician / music_work /
#     video_game / film / tv_series / chess_player, fit is 0 unless that type is in the channel's `entity_types_ok`
#     AND a strong keyword matched in the label or entity description (not just in a headline).
#   - avoid generic words (history, billion, how, update, making, record, first, new...): they caused false positives.
# angle: first matching `angles` rule wins; {topic} is replaced with the topic label.
channels:
  - id: go-there-instead
    name: Go There Instead
    format: "travel shorts: 'Skip X, go here instead' (alternatives to overcrowded places, travel news)"
    links: [https://www.youtube.com/@GoThereInstead, https://www.instagram.com/gothereinstead/, https://www.tiktok.com/@go.there.instead]
    entity_types_ok: []
    strong: [travel, travelers, travellers, tourism, tourist, tourists, overtourism, overcrowded, crowds of tourists, destination, destinations, vacation, holidaymakers,
             airline, airlines, airport, airports, flight cancellations, cancelled flights, new route, new routes, cruise, cruise port, cruise ship, hotel, hotels, visa, visas,
             etias, passport, entry requirements, tourist tax, entry fee, christmas market, christmas markets, northern lights, lapland, rovaniemi, national park,
             unesco world heritage, wikivoyage, ski resort, ski season, travel advisory, travel ban, closed to tourists, theme park, airbnb, ryanair, easyjet]
    weak: [santorini, kotor, dubrovnik, venice, barcelona, amsterdam, paris, rome, iceland, bali, hawaii, greece, italy, croatia, portugal, mexico, caribbean,
           japan, kyoto, beach, island, islands, europe, train, rail, road trip, faa, tsa, delays, strike, booking, expedia, winter, festival, village, old town]
    exclude: []
    angles:
      - match: [overtourism, overcrowded, tourist tax, entry fee, closed to tourists, travel ban]
        angle: "Skip {topic}: the less-crowded alternative to go to instead (and why now)"
      - match: [christmas market, christmas markets, northern lights, lapland, rovaniemi, ski resort, ski season]
        angle: "Skip the famous one, go here instead: a {topic} alternative with fewer crowds"
      - match: [cruise, cruise port, cruise ship]
        angle: "Cruise stop alternative: skip the crowded side of {topic}, go here instead"
      - match: [airline, airlines, airport, airports, flight cancellations, cancelled flights, new route, new routes, visa, visas, etias, passport, entry requirements, travel advisory]
        angle: "Travel news in 30s: what {topic} means for your trip, and the smarter place or route to pick instead"
      - match: []
        angle: "Skip X, go to Y: the travel angle on {topic}"

  - id: intern-broke-it
