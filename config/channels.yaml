             hack, hacked, hackers, breach, data breach, leak, leaked, rce, vulnerability, exploit, ransomware, robot, robots, robotaxi, waymo, autopilot, self-driving, driverless,
             software update, server, servers, cloudflare, aws, github, windows update, app store, smart home, alexa, siri, password, passwords, cyberattack, nvidia, gpu, chip, chips]
    weak: [apple, google, microsoft, meta, amazon, tesla, iphone, android, app, software, code, coding, developer, startup, tech, fail, oops, lawsuit, layoffs, viral]
