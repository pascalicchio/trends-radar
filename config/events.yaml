# Curated upcoming events. Every event MUST have a source_url and a verify block.
# Each run, the pipeline re-fetches verify.wiki (Wikipedia plain text) or verify.url and checks
# that verify.pattern (regex) is present. Unverified events are kept but flagged verified:false.
# wiki_article: used for "hype now" (pageviews last 7d vs prior 28d) and "last year" (views in the
# same calendar window one year earlier, using last_year_article if given).
# Automatic sources (no curation needed): US federal holidays (Nager.Date), Jewish holidays (Hebcal),
# solstices/equinoxes (US Naval Observatory), rocket launches (The Space Devs), US film releases
# (Wikipedia "List of American films of YYYY"), round-number anniversaries (Wikipedia On This Day).
