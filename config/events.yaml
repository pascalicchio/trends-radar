    date: 2026-11-27
    category: shopping
    source_url: https://en.wikipedia.org/wiki/Black_Friday_(shopping)
    verify: {wiki: "Black Friday (shopping)", pattern: "day after Thanksgiving|Friday after Thanksgiving|following Thanksgiving"}
    rule: "Day after US Thanksgiving (Nov 26, 2026 per Nager.Date US holidays)"
    wiki_article: Black_Friday_(shopping)
    tags: [black friday, shopping, deals, holiday]
